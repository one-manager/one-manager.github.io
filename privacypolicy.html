<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3548833231206197"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
    <link rel="icon" type="image/png" href="icon.webp">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
   <link rel="stylesheet" href="main.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<title>Privacy Policy</title>

<style>
    * { box-sizing: border-box; }

    .nav a.active{
      color: var(--neon);
      text-shadow: 0 0 8px rgba(110,231,255,.45);
    }

    /* ============ MOBILE PERFORMANCE ============ */
    .app-card .avatar-wrap::before,
    .app-card .avatar-wrap::after{
      content: none !important;
      animation: none !important;
      background: none !important;
      filter: none !important;
      display: none !important;
      box-shadow: none !important;
    }
    .app-card .avatar-wrap{
      width: 120px;
      height: 120px;
      border: 2px solid var(--neon);
      box-shadow: 0 0 12px rgba(0,255,213,.4);
    }
    .card{
      backdrop-filter: blur(4px) !important;
      -webkit-backdrop-filter: blur(4px) !important;
    }
    .app-card{ margin-bottom: 22px; }

    .info-box .info-row i{
      width: 22px;
      color: var(--neon);
      text-align: center;
    }
    .info-box .info-row span{
      color: #edf2ff;
      font-size: .95rem;
    }
    .info-row strong{
      color: var(--neon);
      font-weight: 600;
    }

    .privacy-text{
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      color: #e2e8ff;
      line-height: 1.85;
      font-size: 1rem;
      text-align: left;
    }

    .error-msg{
      color: #ff9b9b;
      text-align: center;
      font-weight: 600;
      padding: 20px;
      font-size: .95rem;
    }
    .loading-text{
      text-align: center;
      color: var(--muted);
      padding: 20px;
      font-size: .95rem;
    }

    @media (prefers-reduced-motion: reduce){
      *{
        animation: none !important;
        transition: none !important;
      }
    }

    @media (max-width: 600px){
      .card{
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background: rgba(12,18,40,.92) !important;
      }
    }
</style>

</head>
<body>
  <div class="container">

    <!-- ================= TOPBAR ================= -->
    <div class="topbar">
      <div class="logo">MARU</div>
      <div class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="apps.html">Apps</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="feedback.html">Feedback</a>
        <a href="privacypolicy.html" class="active">Privacy Policy</a>
      </div>
    </div>

    <!-- ================= DYNAMIC CONTENT ================= -->
    <div id="content">
      <p class="loading-text">Loading Privacy Policy...</p>
    </div>
 <footer>
        <div class="yearNeed">© MARU. All rights reserved.</div>
        <div class="line yearNeed">MARU Apps • Solo Developer • Frontend Developer • UI Designer</div>
    </footer>
  </div>

<script src="data.js"></script>

<script type="module">
    /* ============ FORMATTERS ============ */
    function formatCategories(arr) {
        if (!arr || arr.length === 0) return "General";
        return arr.map(i => window.categories[i]).filter(Boolean).join(" • ");
    }
    function formatPlatform(arr) {
        if (!arr || arr.length === 0) return "Android";
        return arr.map(i => window.platforms[i]).filter(Boolean).join(" • ");
    }

    /* ============ GENERAL PRIVACY POLICY (~1,050 chars) ============ */
    const GENERAL_PRIVACY = `MARU is an independent software studio run by a single solo developer. I build small, fast, and privacy-focused applications for Android and the modern web. This general privacy policy applies to all apps published under the MARU name when a specific app policy is not available.

I believe privacy is a basic right, not a feature. I collect the absolute minimum amount of information required for my apps to function. Wherever possible, all data is stored locally on your device instead of being uploaded to a remote server. I do not sell, rent, or share your personal information with advertisers, analytics companies, or any third party. I do not bundle aggressive trackers, and I do not use your data to build advertising profiles.

When an app requires internet access, it is used only for specific purposes such as checking for updates or verifying a license. These connections never transmit personal user data. Permissions requested by my apps are always explained in plain language, and if a permission is not strictly required for the core function, it is not requested.

I am a solo developer, not a corporation. Every app I publish is reviewed, tested, and signed by me personally. If you have questions about how a specific app handles your data, please reach out through the Contact page and I will respond directly.

Thank you for supporting independent software development.`;

    /* ============ RENDER: GENERAL PRIVACY (fallback) ============ */
    function renderGeneralPrivacy(reasonText) {
        const content = document.getElementById("content");
        content.innerHTML = `
            <!-- ================= GENERAL PRIVACY INFO CARD ================= -->
            <div class="card app-card">
                <div class="profile">
                    <div class="avatar-wrap">
                        <img src="icon.webp" alt="MARU" class="avatar" onerror="this.src='icon.webp'">
                    </div>
                    <div class="name">MARU</div>
                    <div class="tag">General Privacy Policy</div>
                </div>

                <div class="info-box">
                    <div class="info-row">
                        <i class="fas fa-user-tie"></i>
                        <span>Developer: <strong>MARU TECH (Solo)</strong></span>
                    </div>
                    <div class="info-row">
                        <i class="fas fa-shield-halved"></i>
                        <span>Data Selling: <strong>Never</strong></span>
                    </div>
                    <div class="info-row">
                        <i class="fas fa-lock"></i>
                        <span>Storage: <strong>Local-first</strong></span>
                    </div>
                    <div class="info-row">
                        <i class="fas fa-eye-slash"></i>
                        <span>Tracking: <strong>None</strong></span>
                    </div>
                    <div class="info-row">
                        <i class="fas fa-globe"></i>
                        <span>Applies to: <strong>All MARU apps</strong></span>
                    </div>
                </div>
            </div>

            <!-- ================= GENERAL PRIVACY TEXT CARD ================= -->
            <div class="card">
                <h2 class="section-title">Privacy Policy</h2>
                ${reasonText ? `<p class="text" style="margin-bottom:14px; color:var(--muted); font-size:.92rem;"><i class="fas fa-info-circle" style="color:var(--neon);"></i> ${reasonText}</p>` : ''}
                <p class="text" style="margin-bottom:14px;">
                    This Privacy Policy explains how <strong>MARU</strong> handles your information across all published applications.
                </p>
                <div class="privacy-text">${GENERAL_PRIVACY}</div>
            </div>

            <!-- ================= RELATED LINKS CARD ================= -->
            <div class="card" style="margin-top:22px;">
                <h2 class="section-title">Need More Information?</h2>
                <p class="text" style="margin-bottom:14px;">
                    If you have any questions about this privacy policy or how your data is handled, feel free to reach out or explore related pages.
                </p>

                <div class="links">
                    <a href="contact.html" class="linkbtn">
                        <i class="fas fa-envelope"></i> Contact Me
                    </a>
                    <a href="feedback.html" class="linkbtn">
                        <i class="fas fa-comment-dots"></i> Send Feedback
                    </a>
                    <a href="apps.html" class="linkbtn">
                        <i class="fas fa-th-large"></i> Back to Apps
                    </a>
                </div>
            </div>
        `;
    }

    /* ============ RENDER: APP-SPECIFIC PRIVACY ============ */
    function renderAppPrivacy(app, i) {
        const content = document.getElementById("content");
        const appPrivacy = app.privacypolicy || "";
        const appName = app.name || "Unknown App";
        const appVersion = app.version || "Unknown";
        const appSize = app.size || "Unknown";
        const appStatus = app.NotFinished ? "Coming Soon" : "Available";
        const statusColor = app.NotFinished ? "#fbbf24" : "#00ff66";
        const appCategories = formatCategories(app.categories);
        const appPlatform = formatPlatform(app.type);

        /* If app has NO privacy policy text → fall back to general */
        if (!appPrivacy || appPrivacy.trim().length === 0) {
            renderGeneralPrivacy(`No specific privacy policy was provided for <strong>${appName}</strong>, so the general MARU policy applies below.`);
            return;
        }

        content.innerHTML = `
            <!-- ================= APP INFO CARD ================= -->
            <div class="card app-card">
                <div class="profile">
                    <div class="avatar-wrap">
                        <img src="images/${i}.webp" alt="${appName}" class="avatar" onerror="this.src='icon.webp'">
                    </div>
                    <div class="name">${appName}</div>
                    <div class="tag">Privacy Policy</div>
                </div>

                <div class="info-box">
                    <div class="info-row">
                        <i class="fas fa-user-tie"></i>
                        <span>Developer: <strong>MARU TECH</strong></span>
                    </div>
                    <div class="info-row">
                        <i class="fas fa-mobile-screen"></i>
                        <span>App: <strong>${appName}</strong></span>
                    </div>
                    <div class="info-row">
                        <i class="fas fa-code-branch"></i>
                        <span>Version: <strong>${appVersion}</strong></span>
                    </div>
                    <div class="info-row">
                        <i class="fas fa-database"></i>
                        <span>Size: <strong>${appSize}</strong></span>
                    </div>
                    <div class="info-row">
                        <i class="fas fa-circle-check"></i>
                        <span>Status: <strong style="color:${statusColor}">${appStatus}</strong></span>
                    </div>
                    <div class="info-row">
                        <i class="fas fa-layer-group"></i>
                        <span>Categories: <strong>${appCategories}</strong></span>
                    </div>
                    <div class="info-row">
                        <i class="fas fa-desktop"></i>
                        <span>Platform: <strong>${appPlatform}</strong></span>
                    </div>
                </div>
            </div>

            <!-- ================= APP PRIVACY TEXT CARD ================= -->
            <div class="card">
                <h2 class="section-title">Privacy Policy</h2>
                <p class="text" style="margin-bottom:14px;">
                    This Privacy Policy explains how <strong>${appName}</strong> collects, uses, and protects your information. Please read it carefully before using the app.
                </p>
                <div class="privacy-text">${appPrivacy}</div>
            </div>

            <!-- ================= RELATED LINKS CARD ================= -->
            <div class="card" style="margin-top:22px;">
                <h2 class="section-title">Need More Information?</h2>
                <p class="text" style="margin-bottom:14px;">
                    If you have any questions about this privacy policy or how your data is handled, feel free to reach out or explore related pages.
                </p>

                <div class="links">
                    <a href="help.html?id=${i}" class="linkbtn">
                        <i class="fas fa-circle-question"></i> Help & FAQ
                    </a>
                    <a href="contact.html" class="linkbtn">
                        <i class="fas fa-envelope"></i> Contact Me
                    </a>
                    <a href="apps.html" class="linkbtn">
                        <i class="fas fa-th-large"></i> Back to Apps
                    </a>
                </div>
            </div>
        `;
    }

    /* ============ MAIN LOGIC ============ */
    const params = new URLSearchParams(window.location.search);
    const i = parseInt(params.get("id"));
    const hasValidId = Number.isInteger(i) && !isNaN(i);

    if (!hasValidId) {
        renderGeneralPrivacy("No specific app was selected, so the general MARU privacy policy is shown below.");
    } else {
        try {
            const response = await fetch("jsons/apps.json");
            if (!response.ok) throw new Error("Network error");
            const data = await response.json();
            const apps = data.apps;
            const app = apps.find(a => a.id === i);

            if (app) {
                renderAppPrivacy(app, i);
            } else {
                renderGeneralPrivacy(`App with id <strong>${i}</strong> was not found, so the general MARU privacy policy is shown below.`);
            }
        } catch (error) {
            console.error(error);
            renderGeneralPrivacy("Could not load app-specific data. The general MARU privacy policy is shown below.");
        }
    }

    /* ============ LEFT PAGE TOGGLE ============ */
    document.addEventListener("click", function(e) {
        const page = document.querySelector(".left-page");
        if (!page) return;
        if (e.target.closest(".show-page")) {
            page.classList.add("show-vis");
        } else if (!e.target.closest(".left-page")) {
            page.classList.remove("show-vis");
        }
    });
</script>
<script src="/analytics.js"></script>

</body>
</html>
