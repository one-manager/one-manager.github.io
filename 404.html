<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3548833231206197"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <link rel="icon" type="image/webp" href="icon.webp">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We've Moved | MARUZENIX</title>
    <meta name="description" content="MARUZENIX has moved to a new domain: maruzenix.pages.dev. Please visit the new site to continue.">
    <meta name="robots" content="noindex">

    <link rel="stylesheet" href="main.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        /* ============ PROFESSIONAL SINGLE-CARD LAYOUT ============ */
        .moved-wrap{
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .moved-card{
            background: var(--card);
            border: 1px solid rgba(110, 231, 255, 0.18);
            border-radius: 16px;
            padding: 56px 48px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
        }

        /* Icon — simple, no glow */
        .moved-icon{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(0, 255, 213, 0.10);
            border: 1px solid rgba(0, 255, 213, 0.30);
            color: var(--neon);
            font-size: 1.5rem;
            margin-bottom: 24px;
        }

        /* Title — no animation, clean */
        .moved-title{
            font-size: 2rem;
            font-weight: 700;
            color: #f5f7ff;
            margin-bottom: 14px;
            line-height: 1.25;
            letter-spacing: -0.5px;
        }

        /* Subtitle */
        .moved-subtitle{
            font-size: 1rem;
            color: #a4aed6;
            line-height: 1.65;
            margin-bottom: 32px;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Domain box — clean, no dashed */
        .moved-domain{
            display: block;
            padding: 16px 20px;
            background: rgba(0, 255, 213, 0.06);
            border: 1px solid rgba(0, 255, 213, 0.25);
            border-radius: 10px;
            color: var(--neon);
            font-family: 'SF Mono', 'Courier New', Consolas, monospace;
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 28px;
            word-break: break-all;
            user-select: all;
        }

        /* Primary button — like Google/Microsoft */
        .moved-btn{
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 340px;
            padding: 14px 24px;
            background: var(--neon);
            color: #050816;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
            margin-bottom: 20px;
        }

        .moved-btn:hover{
            background: #00e6c0;
        }

        .moved-btn:active{
            background: #00cfa9;
        }

        /* Small note under button */
        .moved-note{
            font-size: 0.85rem;
            color: #7d879f;
            line-height: 1.6;
        }

        /* Simple divider + small links */
        .moved-links{
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(110, 231, 255, 0.10);
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .moved-links a{
            color: #a4aed6;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color 0.15s;
        }

        .moved-links a:hover{
            color: var(--neon);
        }

        /* Mobile */
        @media (max-width: 520px){
            .moved-card{
                padding: 40px 24px;
                border-radius: 14px;
            }
            .moved-title{
                font-size: 1.6rem;
            }
            .moved-subtitle{
                font-size: 0.95rem;
                margin-bottom: 26px;
            }
            .moved-domain{
                font-size: 1rem;
                padding: 14px 16px;
            }
            .moved-icon{
                width: 48px;
                height: 48px;
                font-size: 1.3rem;
                margin-bottom: 20px;
            }
        }

        /* Remove all motion */
        @media (prefers-reduced-motion: reduce){
            *{
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ============ TOPBAR (all links → new domain) ============ -->
    <div class="topbar">
        <div class="logo">MARUZENIX</div>
        <div class="nav">
            <a href="https://maruzenix.pages.dev">Home</a>
              <a href="https://maruzenix.pages.dev/apps">Apps</a>
               </div>
    </div>

    <!-- ============ SINGLE CLEAN CARD ============ -->
    <div class="moved-wrap">
        <div class="moved-card">

            <div class="moved-icon">
                <i class="fas fa-arrow-right"></i>
            </div>

            <h1 class="moved-title">We've moved</h1>

            <p class="moved-subtitle">
                MARUZENIX has a new home. Please visit the new domain to continue browsing apps and pages.
            </p>

            <code class="moved-domain">maruzenix.pages.dev</code>

            <a href="https://maruzenix.pages.dev" class="moved-btn">
                <span>Go to maruzenix.pages.dev</span>
                <i class="fas fa-arrow-right" style="font-size: 0.85rem;"></i>
            </a>

            <p class="moved-note">
                The old domain may stop working soon. Please update your bookmarks.
            </p>

            <div class="moved-links">
                <a href="https://maruzenix.pages.dev/apps">Browse Apps</a>
                <a href="https://maruzenix.pages.dev/about">About</a>
                <a href="https://maruzenix.pages.dev/contact">Contact</a>
            </div>

        </div>
    </div>

</div>

<script src="/analytics.js"></script>
 <script src="popup.js"></script>

</body>
    </html>
