<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3548833231206197"
     crossorigin="anonymous"></script>
<meta charset="UTF-8">
<title>Download App</title>
<link rel="icon" type="image/png" href="icon.webp">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<link rel="stylesheet" href="main.css"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  * { box-sizing: border-box; }

  /* ============ MOBILE PERFORMANCE ============ */
  .app-card .avatar-wrap::before,
  .app-card .avatar-wrap::after{
    content: none !important;
    animation: none !important;
    background: none !important;
    filter: none !important;
    display: none !important;
    box-shadow: none !important;
  }
  .app-card .avatar-wrap{
    width: 120px;
    height: 120px;
    border: 2px solid var(--neon);
    box-shadow: 0 0 12px rgba(0,255,213,.4);
  }
  .card{
    backdrop-filter: blur(4px) !important;
    -webkit-backdrop-filter: blur(4px) !important;
  }
  .app-card{ margin-bottom: 22px; }

  .info-box .info-row i{
    width: 22px;
    color: var(--neon);
    text-align: center;
  }
  .info-box .info-row span{
    color: #edf2ff;
    font-size: .95rem;
  }
  .info-row strong{
    color: var(--neon);
    font-weight: 600;
  }

  /* ============ DESCRIPTION ============ */
  .description-text{
    color: #e2e8ff;
    line-height: 1.85;
    font-size: 1rem;
    text-align: left;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .description-text strong{
    color: var(--neon);
    font-weight: 700;
  }
  .description-text .md-bullet{
    display: block;
    padding-left: 18px;
    position: relative;
    margin: 6px 0;
  }
  .description-text .md-bullet::before{
    content: '•';
    position: absolute;
    left: 4px;
    color: var(--neon);
    font-weight: bold;
  }

  /* ============ PHOTO GRID ============ */
  .photo-grid{
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 10px;
    width: 100%;
    padding: 10px 0;
    overflow-x: auto;
    overflow-y: hidden;
    justify-content: flex-start;
    align-items: center;
    margin-top: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .photo-grid::-webkit-scrollbar{ height: 6px; }
  .photo-grid::-webkit-scrollbar-track{
    background: rgba(255,255,255,.04);
    border-radius: 6px;
  }
  .photo-grid::-webkit-scrollbar-thumb{
    background: var(--neon);
    border-radius: 6px;
  }
  .photo-grid img{
    width: 160px;
    height: 200px;
    object-fit: cover;
    flex-shrink: 0;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid rgba(110,231,255,.14);
    transition: border-color .2s ease;
  }
  .photo-grid img:hover{
    border-color: var(--neon);
  }

  /* ============ DOWNLOAD BUTTON ============ */
  .download-btn{
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    height: 45px;
    padding: 14px 18px;
    margin-top: 18px;
    background: transparent;
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: .5px;
    text-transform: uppercase;
    font-family: inherit;
    outline: none;
    border-radius: 40px;
    border: 2px solid rgba(55,155,157,.8);
    box-shadow: 0 0 10px rgba(55,155,157,.8);
    cursor: default;
    z-index: 1;
    overflow: hidden;
  }
  .download-btn::before{
    position: absolute;
    content: "";
    width: 100%;
    height: 300%;
    top: -100%;
    left: 0;
    background: linear-gradient(#081b29, rgba(55,155,157,1), #081b29, rgba(55,155,157,.8));
    z-index: -1;
    transition: .5s;
  }
  .download-btn:hover::before{
    top: 0;
  }
 
  .download-btn:disabled{
    opacity: .72;
    cursor: not-allowed;
    transform: none;
    background: #aeaeae;
    border-color: #aeaeae;
    box-shadow: none;
  }
  .download-btn:disabled::before{
    display: none;
  }

  /* ============ OVERLAY ============ */
  #overlay{
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 1000;
    padding: 20px;
  }
  #overlay img{
    max-width: 95%;
    max-height: 80vh;
    border-radius: 10px;
    object-fit: contain;
  }
  .close-btn{
    margin-top: 16px;
    padding: 10px 24px;
    background: #fff;
    color: #000;
    border-radius: 8px;
    cursor: pointer;
    font-size: .95rem;
    font-weight: 600;
    border: none;
  }
  .close-btn:active{ opacity: .6; }

  .nav-arrow{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 2.5rem;
    color: #fff;
    cursor: pointer;
    user-select: none;
    padding: 12px;
    background: rgba(0,0,0,.4);
    border-radius: 50%;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-arrow:active{ opacity: .6; }
  .nav-arrow.prev{ left: 16px; }
  .nav-arrow.next{ right: 16px; }

  /* ============ ERROR / LOADING ============ */
  .error-msg{
    color: #ff9b9b;
    text-align: center;
    font-weight: 600;
    padding: 20px;
    font-size: .95rem;
  }
  .loading-text{
    text-align: center;
    color: var(--muted);
    padding: 20px;
    font-size: .95rem;
  }

  @media (prefers-reduced-motion: reduce){
    *{
      animation: none !important;
      transition: none !important;
    }
  }
  @media (max-width: 600px){
    .card{
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      background: rgba(12,18,40,.92) !important;
    }
    .photo-grid img{
      width: 140px;
      height: 180px;
    }
  }
</style>
</head>
<body>

<div class="container">

  <!-- ================= TOPBAR (NO BACK BUTTON) ================= -->
  <div class="topbar">
    <div class="logo">MARU</div>
    <div class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="apps.html">Apps</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
      <a href="feedback.html">Feedback</a>
      <a href="privacypolicy.html">Privacy Policy</a>
    </div>
  </div>

  <div id="content">
    <p class="loading-text">Loading app...</p>
  </div>
    <footer>
        <div class="yearNeed">© MARU. All rights reserved.</div>
        <div class="line yearNeed">MARU Apps • Solo Developer • Frontend Developer • UI Designer</div>
    </footer>
</div>

<div id="overlay">
  <span class="nav-arrow prev">&#10094;</span>
  <img id="overlayImg" src="" alt="Photo">
  <span class="nav-arrow next">&#10095;</span>
  <button class="close-btn" type="button">Close</button>
</div>

<script src="data.js"></script>

<script type="module">
  function formatCategories(arr) {
    if (!arr || arr.length === 0) return "General";
    return arr.map(i => window.categories[i]).filter(Boolean).join(" • ");
  }
  function formatPlatform(arr) {
    if (!arr || arr.length === 0) return "Android";
    return arr.map(i => window.platforms[i]).filter(Boolean).join(" • ");
  }

  function parseMarkdown(text) {
    if (!text) return "";
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n\* /g, "\n<span class='md-bullet'>")
      .replace(/(<span class='md-bullet'>[^\n]*)/g, "$1</span>");
  }

  const params = new URLSearchParams(location.search);
  const appId = parseInt(params.get("id"));
  const content = document.getElementById("content");

  try {
    const response = await fetch("jsons/apps.json");
    if (!response.ok) throw new Error("Network error");
    const data = await response.json();
    const apps = data.apps;
    const app = apps.find(a => a.id === appId);

    if (app) {
      const appFile = app.apk;
      const appName = app.name || "Unknown App";
      const appVersion = app.version || "Unknown";
      const appSize = app.size || "Unknown";
      const appDescription = app.description || "No description available.";
      const appShortDes = app.shortDes || appDescription.split(" ").slice(0, 12).join(" ") + "...";
      const appStatus = app.NotFinished ? "Coming Soon" : "Available";
      const statusColor = app.NotFinished ? "#a4cc37" : "#00ff66";
      const appCategories = formatCategories(app.categories);
      const appPlatform = formatPlatform(app.type);
      const photosLength = parseInt(app.photosLength) || 0;

      let photosHTML = "";
      if (photosLength > 0) {
        photosHTML = '<div class="photo-grid">';
        for (let i = 0; i < photosLength; i++) {
          photosHTML += `<img src="images/${appId}${i}.webp" data-i="${i}" alt="Screenshot ${i + 1}" onerror="this.src='default-icon.png'">`;
        }
        photosHTML += '</div>';
      }

      content.innerHTML = `
        <div class="card app-card">
          <div class="profile">
            <div class="avatar-wrap">
              <img src="images/${appId}.webp" alt="${appName}" class="avatar" onerror="this.src='icon.webp'">
            </div>
            <div class="name">${appName}</div>
            <div class="tag">${appShortDes}</div>
          </div>

          <div class="info-box">
            <div class="info-row">
              <i class="fas fa-user-tie"></i>
              <span>Developer: <strong>MARU TECH</strong></span>
            </div>
            <div class="info-row">
              <i class="fas fa-mobile-screen"></i>
              <span>App: <strong>${appName}</strong></span>
            </div>
            <div class="info-row">
              <i class="fas fa-code-branch"></i>
              <span>Version: <strong>${appVersion}</strong></span>
            </div>
            <div class="info-row">
              <i class="fas fa-database"></i>
              <span>Size: <strong>${appSize}</strong></span>
            </div>
            <div class="info-row">
              <i class="fas fa-circle-check"></i>
              <span>Status: <strong style="color:${statusColor}">${appStatus}</strong></span>
            </div>
            <div class="info-row">
              <i class="fas fa-layer-group"></i>
              <span>Categories: <strong>${appCategories}</strong></span>
            </div>
            <div class="info-row">
              <i class="fas fa-desktop"></i>
              <span>Platform: <strong>${appPlatform}</strong></span>
            </div>
          </div>

          ${app.NotFinished
            ? `<button class="download-btn" disabled type="button"><i class="fas fa-clock"></i> Coming Soon</button>`
            : `<button class="download-btn" type="button" onclick="location.href='${appFile}'"><i class="fas fa-download"></i> Download</button>`
          }
        </div>

        <div class="card">
          <h2 class="section-title">About this App</h2>
          <div class="description-text">${parseMarkdown(appDescription)}</div>
        </div>

        ${photosLength > 0 ? `
          <div class="card" style="margin-top: 22px;">
            <h2 class="section-title">Screenshots</h2>
            <p class="text" style="margin-bottom:8px;">Tap any screenshot to view it in full size.</p>
            ${photosHTML}
          </div>
        ` : ''}

        <div class="card" style="margin-top:22px;">
          <h2 class="section-title">More Information</h2>
          <p class="text" style="margin-bottom:14px;">Explore related pages for this app or return to the catalogue.</p>

          <div class="links">
            <a href="privacypolicy.html?id=${appId}" class="linkbtn">
              <i class="fas fa-shield-halved"></i> Privacy Policy
            </a>
            <a href="help.html?id=${appId}" class="linkbtn">
              <i class="fas fa-circle-question"></i> Help & FAQ
            </a>
            <a href="apps.html" class="linkbtn">
              <i class="fas fa-th-large"></i> Back to Apps
            </a>
          </div>
        </div>
      `;

      const overlay = document.getElementById("overlay");
      const overlayImg = document.getElementById("overlayImg");
      const imgs = document.querySelectorAll(".photo-grid img");
      let currentIndex = 0;

      function showPhoto(i) {
        if (photosLength <= 0) return;
        currentIndex = i;
        overlayImg.src = `images/${appId}${i}.webp`;
        overlay.style.display = "flex";
      }

      imgs.forEach(img => {
        img.addEventListener("click", () => showPhoto(parseInt(img.dataset.i)));
      });

      document.querySelector(".close-btn").addEventListener("click", () => {
        overlay.style.display = "none";
      });

      document.querySelector(".prev").addEventListener("click", () => {
        if (photosLength > 0) {
          currentIndex = (currentIndex - 1 + photosLength) % photosLength;
          overlayImg.src = `images/${appId}${currentIndex}.webp`;
        }
      });

      document.querySelector(".next").addEventListener("click", () => {
        if (photosLength > 0) {
          currentIndex = (currentIndex + 1) % photosLength;
          overlayImg.src = `images/${appId}${currentIndex}.webp`;
        }
      });

      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) overlay.style.display = "none";
      });

      document.addEventListener("keydown", (e) => {
        if (overlay.style.display !== "flex") return;
        if (e.key === "Escape") overlay.style.display = "none";
        if (e.key === "ArrowLeft") document.querySelector(".prev").click();
        if (e.key === "ArrowRight") document.querySelector(".next").click();
      });

    } else {
      content.innerHTML = `
        <div class="card">
          <h2 class="section-title">App Not Found</h2>
          <p class="text">The requested app could not be found. It may have been removed or the link is invalid.</p>
          <div class="links" style="margin-top:14px;">
            <a href="apps.html" class="linkbtn">
              <i class="fas fa-th-large"></i> Back to Apps
            </a>
          </div>
        </div>
      `;
    }
  } catch (error) {
    console.error(error);
    content.innerHTML = `
      <div class="card">
        <h2 class="section-title">Error</h2>
        <p class="error-msg">Could not load app data. Please try again.</p>
        <div class="links" style="margin-top:14px;">
          <a href="apps.html" class="linkbtn">
            <i class="fas fa-th-large"></i> Back to Apps
          </a>
        </div>
      </div>
    `;
  }
</script>

<script src="/analytics.js"></script>

</body>
</html>
