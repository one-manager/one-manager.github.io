<script type="module">
  let response = await fetch("jsons/apps.json");
  let data = await response.json();
  let apps = data.apps;

  function fromHex(hex) {
    try {
      return hex
        .trim()
        .split(/\s+/)
        .map(h => String.fromCodePoint(parseInt(h, 16)))
        .join("");
    } catch {
      return "";
    }
  }

  const params = new URLSearchParams(location.search);
  const appId = parseInt(params.get("id")) || 0;
  const app = apps.find(a => a.id === appId);

  if (app) {
    const appFile = app.apk;
    const iconURL = appId + ".webp";
    const description = app.description;
    const photosLength = parseInt(app.photosLength) || 0;
    const appName = app.name;
    const versionName = app.version;
    const appNew = app.new;
    const shortDes = app.shortDes;
    const appSize = await calculateSize(app.apk);
    
      // Si badbaado leh u qor magaca iyo waxa cusub maadaama app-ku jiro
    document.getElementById("name").innerText = appName || "APP NOT FOUND";
    document.getElementById("about").innerText = description;
    document.getElementById("short-desp").innerText = shortDes || description.split(" ").slice(0,9).join(" ");
    document.getElementById("aPrivacy").href = `privacypolicy.html?id=${appId}`;
    document.getElementById("aHelp").href = `help.html?id=${appId}`;
    document.getElementById("popupImage").src = `images/${appId}.webp`;


    // U dhis Photo Grid-ka si sax ah
    let photosHTML = "";
    if (photosLength > 0) {
      photosHTML += '<div class="photo-grid">';
      for (let i = 0; i < photosLength; i++) {
        photosHTML += `<img src="images/${appId}${i}.webp" data-i="${i}" onerror="this.src='default-icon.png'">`;
      }
      photosHTML += '</div>';
    }
    let isAvailable = app.NotFinished ?  {text: "Coming", color: "#a4cc37"} :  {text: "Available", color: "#00ff66"}

    // Isticmaal insertAdjacentHTML si aanay event listeners-kii hore u hallaabin
    document.body.insertAdjacentHTML('beforeend', `
   
      <div id="content">
        <img src="images/${iconURL}">
    <div class="name">
        <h2>${appName}</h2>
    <p class="watermark">MARU Tech</p>
    <div class=status>Status
    <p class="stat" style="color: ${isAvailable.color}">${isAvailable.text}</p></div> 
    
    <div class="version">Version <p>${versionName}</p></div>
    <div class="size">Size <p>${appSize}</p></div>
   
    </div>
        
        <button ${app.NotFinished ? "disabled" : ""} onclick="location.href='${appFile}'">
    ${app.NotFinished ? "Coming" : "Downlaod"}
</button>      
      </div>
       ${photosHTML}   
      <div id="overlay">
        <span class="nav prev">&#10094;</span>
        <img id="overlayImg">
        <span class="nav next">&#10095;</span>
        <div class="close-btn">Close</div>
      </div>
    
    `);

    // Hadda kudar dhacdooyinka (Events) mar jidka HTML-ka la geliyay bogga
    const overlay = document.getElementById("overlay");
    const overlayImg = document.getElementById("overlayImg");
    const imgs = document.querySelectorAll(".photo-grid img");
    let index = 0;

    function show(i) {
      index = i;
      overlayImg.src = `images/${appId}${i}.webp`;
      overlay.style.display = "flex";
    }

    imgs.forEach(img => {
      img.onclick = () => show(parseInt(img.dataset.i));
    });

    document.querySelector(".close-btn").onclick = () => {
      overlay.style.display = "none";
    };

    document.querySelector(".prev").onclick = () => {
      if (photosLength > 0) {
        index = (index - 1 + photosLength) % photosLength;
        overlayImg.src = `images/${appId}${index}.webp`;
      }
    };

    document.querySelector(".next").onclick = () => {
      if (photosLength > 0) {
        index = (index + 1) % photosLength;
        overlayImg.src = `images/${appId}${index}.webp`;
      }
    };

    // Badhanka Popup-ka muujiya (btn-show wuxuu ku jiraa content-ka la dhalay)
    document.querySelector(".about_show").onclick = function () {
      document.querySelector(".popup").classList.add("show-popup");
    };

  } else {
    document.body.innerHTML = "<h2 style='text-align:center; margin-top:20%; color:#ef4444;'>App not found</h2>";
  }

  // Badhamada had iyo jeer HTML-ka sare ku jiray ee bannaanka ka shaqayn kara
  document.querySelector(".btn-hide").onclick = function () {
    document.querySelector(".popup").classList.remove("show-popup");  
  };

  document.addEventListener("click", function(e) {
    const page = document.querySelector(".left-page");
    if (e.target.closest(".show-page")) {
        page.classList.add("show-vis");
    } else if (!e.target.closest(".left-page")) {
        page.classList.remove("show-vis");
    }
  }); 


 
</script>
<script>
async function calculateSize(file) {
  try {
    // Marka hore isku day HEAD maadaama uu ka dhakhso badan yahay
    let response = await fetch(file, { method: "HEAD", cache: "no-store" });
    
    // Haddii HEAD la diido (CORS darteed), isticmaal GET caadi ah laakiin soo qaad xog kooban
    if (!response.ok) {
      response = await fetch(file, { method: "GET", cache: "no-store" });
    }

    if (response.ok) {
      const size = response.headers.get("Content-Length");
      if (size && Number(size) > 0) {
        return formatSize(Number(size));
      }
    }
    return "Unknown";
  } catch (error) {
    console.error("Failed to calculate APK size:", error);
    return "Unknown";
  }
}

// Kaliya hal shaqo oo formatSize ah u daay (tan ayaa ugu nidaamsan)
function formatSize(bytes) {
  if (!Number.isFinite(bytes) || bytes < 0) {
    return "Unknown";
  }
  if (bytes === 0) {
    return "0 B";
  }
  const units = ["B", "KB", "MB", "GB", "TB"];
  const i = Math.min(
    Math.floor(Math.log(bytes) / Math.log(1000)), // 1024 ayaa sax ah kombiyuutarka (halkii ay ka ahaan lahayd 1000)
    units.length - 1
  );
  return `${(bytes / Math.pow(1000, i)).toFixed(2)} ${units[i]}`;
}
